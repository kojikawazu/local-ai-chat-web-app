<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>E2E の確認用のページ</title>
  </head>
  <body>
    <h1>確認用のページ</h1>
    <!-- 合言葉は JavaScript で描く（静的な HTML には無いため、ブラウザで開かないと読めない） -->
    <p id="passphrase"></p>
    <script>
      document.getElementById('passphrase').textContent =
        '合言葉は「しろくま73」です';
    </script>
  </body>
</html>
