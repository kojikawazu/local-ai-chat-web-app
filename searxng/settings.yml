# SearXNG の設定（web_search ツールの検索エンジン。#151）。
# 既定の設定を引き継ぎ、ローカルで 1 人が使うための差分だけを書く。
# 項目の意味: https://docs.searxng.org/admin/settings/index.html
use_default_settings: true

server:
  # 同時アクセスの制限。インターネットに公開するインスタンス向けの機能で、
  # docker-compose.yml で 127.0.0.1 だけに公開するローカル利用では要らない
  limiter: false
  # 画像の中継。web_search は画像を使わない
  image_proxy: false

search:
  # JSON の API を有効にする（既定は html だけで、format=json は 403 になる）。
  # html は、ブラウザで http://localhost:8888 を開いて動作を確かめるために残す
  formats:
    - html
    - json

# 既定で有効な Web 検索エンジン（Brave・DuckDuckGo・Google CSE）は、アクセスが続くと
# 止められる（Brave・Google CSE は too many requests、DuckDuckGo の html 版は毎回 CAPTCHA）。
# すべて止められると検索できなくなるため、日本語のクエリでも結果を返すエンジンを足し、
# 1 つが止められても残りで結果を返せるようにする（#157）
engines:
  - name: yahoo
    disabled: false
  # duckduckgo.com を使う版。html 版（duckduckgo）とは別に止められる
  - name: duckduckgo web
    disabled: false
  # 単独では関係の薄い結果も返すが、複数のエンジンが共通して返した結果が上位に並ぶため補助として使う
  - name: bing
    disabled: false
  # html.duckduckgo.com を使う版。毎回 CAPTCHA で応答しない。応答しないエンジンが残ると、
  # 他のエンジンの 0 件を「検索エンジンが応答しなかった」失敗として扱うことになるため外す
  - name: duckduckgo
    disabled: true
