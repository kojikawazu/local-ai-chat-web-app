name: Unit Tests

# ドキュメントのみの変更では発火しない（.claude/rules/testing.md「CI の発火条件」参照）。
# paths-ignore は「変更ファイルが全て該当した場合のみスキップ」なので、コードと
# ドキュメントが混在する PR では通常どおり実行される。
#
# 注意: main に branch protection を設定して本ワークフローを required status check
# に指定する場合、スキップされたジョブは「報告なし」となり PR がマージ不能になる。
# その際は paths-ignore を外すか、同名 job を success させる別ワークフローを用意する。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'manuals/**'
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'manuals/**'
      - '**.md'
      - '.claude/**'
      - 'LICENSE'

jobs:
  unit-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          # E2E ワークフローと同じく Node 20 / lockfileVersion 9.0 と整合する pnpm 10 に固定。
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: front
        # lockfile と package.json の食い違いを書き換えで解決させず、CI を落として検出する
        run: pnpm install --frozen-lockfile

      # UT は純ロジック対象で Ollama / PostgreSQL / Prisma 生成を必要としないため、
      # E2E ジョブと独立に数十秒で完了する。
      - name: Run unit tests
        working-directory: front
        run: pnpm test:unit
