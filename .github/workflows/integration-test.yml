name: Integration Tests

# ドキュメントのみの変更では発火しない（.claude/rules/testing.md「CI の発火条件」参照）。
# paths-ignore は「変更ファイルが全て該当した場合のみスキップ」なので、コードと
# ドキュメントが混在する PR では通常どおり実行される。
#
# 注意: main に branch protection を設定して本ワークフローを required status check
# に指定する場合、スキップされたジョブは「報告なし」となり PR がマージ不能になる。
# その際は paths-ignore を外すか、同名 job を success させる別ワークフローを用意する。
#
# on:（paths-ignore を含むトリガー定義）は quality / unit-test / integration-test / e2e-test の
# 4 本で同一に保つ。GitHub Actions にはトリガーだけを共有する仕組みが無いため重複させ、
# 一致していることを workflow-lint.yml が検査する（.claude/rules/github-actions.md）。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'manuals/**'
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'manuals/**'
      - '**.md'
      - '.claude/**'
      - 'LICENSE'

# 最小権限（.claude/rules/github-actions.md）。チェックアウトと検査のみで書き込みは不要
permissions:
  contents: read

# 同じ PR への連続 push では古い実行を止める。main への push は止めず、
# マージコミットごとに結果を残す（どのマージで壊れたかを追えるようにする）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  integration-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # 他ワークフローと同じく Node 20 / lockfileVersion 9.0 と整合する pnpm 10 に固定。
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # testcontainers 12 が使う undici の webidl.util.markAsUncloneable は
          # undici 6 系（Node 22+）で追加された API。Node 20 では未定義で TypeError に
          # なるため、この IT ジョブのみ Node 22 を使う（他ジョブは Node 20 のまま）。
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: front
        # lockfile と package.json の食い違いを書き換えで解決させず、CI を落として検出する
        run: pnpm install --frozen-lockfile

      # 生成クライアント（src/generated/prisma/）は gitignore のため CI 上で生成が必須。
      - name: Generate Prisma client
        working-directory: front
        run: pnpm prisma generate

      # PostgreSQL は Testcontainers が使い捨てコンテナとして起動する（サービスコンテナ不要）。
      # Ollama / ブラウザは不要。ubuntu-latest には Docker が同梱されている。
      - name: Run integration tests
        working-directory: front
        run: pnpm test:integration
