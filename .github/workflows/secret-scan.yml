name: Secret scan

# 鍵・.env 系の秘匿ファイルが Git の追跡対象に入っていないことを検査する。
# .gitignore は未追跡ファイルにしか効かず、git add -f や除外漏れで一度追跡されると止められない。
# また push 済みのファイルは追跡を外しても履歴に残るため、対処は鍵・トークンのローテーションしかない。
# 「混入させない」.gitignore に対し、こちらは「追跡された時点で落とす」検出側を担う（#100）。
#
# どの変更でも混入しうるため、パスの絞り込み（paths / paths-ignore）は付けず常に実行する。
# git ls-files はインデックスを読むだけで数秒で終わる（.claude/rules/github-actions.md
# 「常時実行のワークフロー」参照）。
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# 最小権限（.claude/rules/github-actions.md）。チェックアウトと検査のみで書き込みは不要
permissions:
  contents: read

# 同じ PR への連続 push では古い実行を止める。main への push は止めず、
# マージコミットごとに結果を残す（どのマージで混入したかを追えるようにする）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  secret-scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assert no secret files are tracked
        env:
          # 検出対象: .env 系（.env / .env.local / .env.production 等）と鍵・認証情報ファイル
          SECRET_PATTERN: '(^|/)(\.env(\..+)?|[^/]+\.(key|pem|p12|pfx|jks|keystore)|id_rsa|id_ed25519|id_dsa|credentials\.json|serviceAccountKey\.json)$'
          # 除外: テンプレート（.env.example 等）と型定義（env.d.ts）は秘匿情報を含まないため
          ALLOW_PATTERN: '\.(example|sample|template|dist)$|\.env\.d\.ts$'
        run: |
          # core.quotePath=false: 既定では非 ASCII のパスが "\347..." のように引用符付きで出力され、
          # 末尾が " になって $ アンカーに一致せず素通りするため、生のパスで出力させる。
          # grep は該当なしで終了コード 1 を返し、bash -e の run: ではそこでジョブが落ちる
          # （正常な「何も見つからない」が失敗扱いになる）。|| true で該当なしを正常として扱う。
          tracked="$(git -c core.quotePath=false ls-files \
            | { grep -E "$SECRET_PATTERN" || true; } \
            | { grep -vE "$ALLOW_PATTERN" || true; })"
          if [ -n "$tracked" ]; then
            while IFS= read -r file; do
              echo "::error file=${file}::秘匿ファイルが Git 管理下にあります。追跡を外しても履歴に残るため、含まれる鍵・トークンはローテーションしてください"
            done <<< "$tracked"
            echo "$tracked"
            exit 1
          fi
          echo "OK: 追跡対象に秘匿ファイルはありません"
