name: E2E Tests

# ドキュメントのみの変更では発火しない（.claude/rules/testing.md「CI の発火条件」参照）。
# paths-ignore は「変更ファイルが全て該当した場合のみスキップ」なので、コードと
# ドキュメントが混在する PR では通常どおり実行される。
#
# 注意: main に branch protection を設定して本ワークフローを required status check
# に指定する場合、スキップされたジョブは「報告なし」となり PR がマージ不能になる。
# その際は paths-ignore を外すか、同名 job を success させる別ワークフローを用意する。
#
# on:（paths-ignore を含むトリガー定義）は quality / unit-test / integration-test / e2e-test の
# 4 本で同一に保つ。GitHub Actions にはトリガーだけを共有する仕組みが無いため重複させ、
# 一致していることを workflow-lint.yml が検査する（.claude/rules/github-actions.md）。
on:
  push:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'manuals/**'
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
  pull_request:
    branches: [main]
    paths-ignore:
      - 'docs/**'
      - 'manuals/**'
      - '**.md'
      - '.claude/**'
      - 'LICENSE'

# 最小権限（.claude/rules/github-actions.md）。チェックアウトと検査のみで書き込みは不要
permissions:
  contents: read

# 同じ PR への連続 push では古い実行を止める。main への push は止めず、
# マージコミットごとに結果を残す（どのマージで壊れたかを追えるようにする）
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: chat_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          # pnpm 11+ は Node.js 22.13+ を要求するため、Node 20 / lockfileVersion 9.0 と
          # 整合する pnpm 10 系に固定する（`latest` は破壊的に上がるため使用しない）
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: front/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: front
        # lockfile と package.json の食い違いを書き換えで解決させず、CI を落として検出する
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        working-directory: front
        run: pnpm exec playwright install --with-deps chromium

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache
          sudo apt-get clean
          df -h

      - name: Setup Ollama
        run: |
          # install.sh は常に最新版を入れるが、新しい Ollama は CPU 推論で
          # qwen2.5:0.5b が segfault（llama-server core dumped）し /api/chat が 5xx を返す。
          # 最後に CI が通った 2026-06-10 時点の最新である 0.30.7 に固定する。
          # 経緯は docs/08-ci-e2e-bug-report.md #13 参照。`latest` は破壊的に上がるため使わない。
          curl -fsSL https://ollama.com/install.sh | OLLAMA_VERSION=0.30.7 sh
          ollama serve &
          sleep 5
          ollama pull qwen2.5:0.5b

      - name: Run Prisma migrations
        working-directory: front
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_db
        run: pnpm prisma migrate deploy

      - name: Generate Prisma client
        working-directory: front
        run: pnpm prisma generate

      - name: Build Next.js
        working-directory: front
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_db
        run: pnpm build

      - name: Run E2E tests
        working-directory: front
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/chat_db
          OLLAMA_BASE_URL: http://localhost:11434
          # E2E のモデルは playwright.config.ts が E2E_OLLAMA_MODEL（既定 qwen2.5:0.5b）から
          # dev サーバーへ OLLAMA_MODEL として渡す。上の pull と揃えるため明示する
          E2E_OLLAMA_MODEL: qwen2.5:0.5b
          CI: true
        run: pnpm test:e2e

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: front/playwright-report/
          retention-days: 30

      - name: Upload test screenshots
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: test-screenshots
          path: front/test-results/
          retention-days: 30
